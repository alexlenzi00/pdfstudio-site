<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pennino">
  <!-- Riproduzione fedele di assets/app.ico (scripts/make_icon.py).
       La sfumatura usa userSpaceOnUse sull'intera larghezza (0..64), come
       fa il codice Python: con objectBoundingBox le due forme del pennino
       avrebbero due sfumature diverse e si vedrebbe la giunzione. -->
  <defs>
    <linearGradient id="metallo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="0">
      <stop offset="0" stop-color="#F7D896"/>
      <stop offset="1" stop-color="#B08434"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="13" fill="#161C2C" stroke="#0D111C"/>

  <!-- corpo del pennino: spalle arrotondate + rastremazione alla punta -->
  <g fill="url(#metallo)">
    <rect x="17" y="11" width="30" height="22" rx="9"/>
    <polygon points="17,25 47,25 32,59"/>
  </g>

  <!-- foro di sfiato e fessura: bucano il metallo mostrando il fondo -->
  <circle cx="32" cy="26" r="4.8" fill="#161C2C"/>
  <polygon points="30.2,26 33.8,26 32.9,57 31.1,57" fill="#161C2C"/>
</svg>
